<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NO-SHOW</title>

  <link rel="stylesheet" href="style.css">

  
  <style>
    /* ================================
       NO-SHOW : ARCHIVE FIX
    ================================= */

    .archive-section {
      width: min(100% - 40px, 900px);
      margin: 100px auto;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.12em;
    }

    .section-no {
      font-size: 11px;
      color: #6b8f71;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: #d8ddd9;
    }

    .session-card {
      border: 1px solid #d9dedb;
      background: #fff;
      transition: 0.25s ease;
    }

    .session-card:hover {
      transform: translateY(-3px);
      border-color: #76947c;
      box-shadow: 0 10px 25px rgba(40, 60, 45, 0.08);
    }

    .session-card-top {
      display: flex;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid #e8ebe9;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #7b817d;
    }

    .session-type {
      color: #6b8f71;
    }

    .session-card-main {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 27px 22px;
    }

    .session-number {
      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #d3dad5;

      font-size: 12px;
      color: #6b8f71;
      letter-spacing: 0.08em;
    }

    .session-info {
      flex: 1;
    }

    .session-info h3 {
      margin: 0 0 7px;
      font-size: 21px;
      font-weight: 600;
    }

    .session-subtitle {
      margin: 0 0 15px;
      font-size: 12px;
      color: #8a8f8b;
    }

    .session-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      font-size: 11px;
      color: #656b67;
    }

    .session-open {
      flex-shrink: 0;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 10px 15px;

      border: 1px solid #1f2421;

      color: #1f2421;
      text-decoration: none;

      font-size: 10px;
      letter-spacing: 0.1em;

      transition: 0.2s ease;
    }

    .session-open:hover {
      background: #1f2421;
      color: #fff;
    }

    .session-card-bottom {
      display: flex;
      justify-content: space-between;

      padding: 10px 18px;

      border-top: 1px solid #e8ebe9;

      font-size: 9px;
      letter-spacing: 0.12em;
      color: #a0a5a1;
    }

    @media (max-width: 600px) {

      .archive-section {
        width: calc(100% - 28px);
        margin: 70px auto;
      }

      .session-card-main {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .session-info {
        width: calc(100% - 70px);
      }

      .session-open {
        margin-left: auto;
      }

    }
  </style>

</head>


<body>

<main class="site">


  <!-- ================================
       MAIN / HERO
  ================================= -->

  <section class="hero">

    <div class="hero-image">
      <img src="main.png" alt="NO-SHOW">
    </div>

    <div class="hero-title">
      <span>NO-SHOW</span>
    </div>

  </section>



 <!-- GALLERY -->

<section class="gallery-section">

  <div class="section-title">
    <span class="section-no">02</span>
    <h2>GALLERY</h2>
    <span class="section-line"></span>
  </div>

  <div class="gallery-grid">

    <div class="gallery-item">
      <img src="gallery01.png" alt="NO-SHOW gallery 01">
      <div class="gallery-credit">
        ART BY 민이 @MINISIFF
      </div>
    </div>

    <div class="gallery-item">
      <img src="gallery02.png" alt="NO-SHOW gallery 02">
      <div class="gallery-credit">
        ART BY 모스 @_grass_w
      </div>
    </div>

    <div class="gallery-item">
      <img src="main.png" alt="NO-SHOW gallery 03">
      <div class="gallery-credit">
        ART BY 작가명
      </div>
    </div>

  </div>

</section>


<!-- CHARACTERS -->

<section class="character-section">

  <div class="section-title">
    <span class="section-no">03</span>
    <h2>CHARACTERS</h2>
    <span class="section-line"></span>
  </div>

  <div style="
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:30px;
  ">

    <div>
      <img
        src="./tetsu.png"
        alt="시노다 테츠"
        style="
          display:block;
          width:100%;
          height:auto;
        "
      >

      <h3>시노다 테츠</h3>
      <p>무심 · 덤덤 · 천연 · 아기</p>
    </div>


    <div>
      <img
        src="./show.png"
        alt="카즈키 쇼우"
        style="
          display:block;
          width:100%;
          height:auto;
        "
      >

      <h3>카즈키 쇼우</h3>
      <p>뻔뻔 · 능글 · 장난기 많음</p>
    </div>

  </div>

</section>



  <!-- ================================
       ARCHIVE
  ================================= -->

  <section id="archive" class="archive-section">

    <div class="section-title">
      <span class="section-no">03</span>
      <h2>ARCHIVE</h2>
      <span class="section-line"></span>
    </div>


    <article class="session-card">


      <div class="session-card-top">

        <span class="session-type">
          COC / TRPG
        </span>

        <span>
          2026.10.05
        </span>

      </div>



      <div class="session-card-main">


        <div class="session-number">
          001
        </div>


        <div class="session-info">

          <h3>
            父の不倫に感謝しています
          </h3>

          <p class="session-subtitle">
            아버지의 불륜에 감사하고 있습니다
          </p>


          <div class="session-meta">

            <span>
              GM. 지영
            </span>

            <span>
              PL. 시노다 테츠 × 카즈키 쇼우
            </span>

          </div>

        </div>



        <!-- ★ 로그 링크 수정 완료 ★ -->

        <a
          href="chichi-log.html"
          class="session-open"
        >
          OPEN
          <span>↗</span>
        </a>


      </div>



      <div class="session-card-bottom">

        <span>
          SESSION LOG
        </span>

        <span>
          NO-SHOW / 001
        </span>

      </div>


    </article>

  </section>



  <!-- ================================
       FOOTER
  ================================= -->

  <footer>

    <p>
      NO-SHOW
    </p>

  </footer>


</main>

</body>

</html>
